<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자기장 안에서 전류가 흐르는 코일이 받는 힘의 특성 추리하기</title>
<style>
  :root{
    --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#bfdcf2;
    --blue:#2563eb; --blue-d:#1e3a8a; --blue-bg:#eff6ff;
    --green:#059669; --green-bg:#ecfdf5; --red:#dc2626; --red-bg:#fef2f2;
    --amber:#b45309; --amber-bg:#fffbeb; --amber-line:#fcd34d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    font-size:20px; line-height:1.5;
    background:linear-gradient(135deg,#e0f2fe 0%,#f0fdf4 100%);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;touch-action:manipulation}

  /* ---------- header ---------- */
  header{background:linear-gradient(90deg,#0284c7,#2563eb 55%,#4f46e5);color:#fff;padding:16px 24px;box-shadow:0 8px 24px rgba(37,99,235,.25)}
  .hd{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  .chip{display:inline-block;background:rgba(255,255,255,.25);padding:4px 14px;border-radius:999px;font-weight:800;font-size:15px}
  h1{margin:6px 0 0;font-size:clamp(24px,3vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.25}
  .score{background:#fff;color:var(--blue-d);font-weight:900;font-size:22px;padding:10px 20px;border-radius:999px;box-shadow:0 6px 16px rgba(15,23,42,.2);white-space:nowrap}

  .wrap{max-width:1500px;width:100%;margin:0 auto;padding:16px 16px 28px;flex:1}
  .goal{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 18px;font-weight:800;font-size:21px;margin-bottom:14px}
  .goal .lab{background:var(--blue);color:#fff;border-radius:10px;padding:2px 12px;font-size:17px;white-space:nowrap}

  /* ---------- step bar ---------- */
  .bar6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 16px;padding:0;list-style:none}
  .sb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:76px;padding:8px 4px;border-radius:16px;border:3px solid #dbe5ee;background:#fff;text-align:center;font-weight:800;font-size:17px;line-height:1.25;color:var(--muted)}
  .sb .no{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e2e8f0;color:#475569;font-weight:900;font-size:18px}
  .sb:focus-visible{outline:4px solid #93c5fd}
  .sb.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d);box-shadow:0 6px 16px rgba(37,99,235,.2)}
  .sb.active .no{background:var(--blue);color:#fff}
  .sb.done{border-color:#86efac;background:var(--green-bg);color:#065f46}
  .sb.done .no{background:var(--green);color:#fff}
  .sb.locked{cursor:not-allowed;opacity:.5}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  @media (min-width:1024px){
    .layout{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
    .stagecol{position:sticky;top:10px}
  }
  .card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 14px 34px rgba(15,23,42,.08);padding:18px}

  /* ---------- stage (SVG 가상실험실) ---------- */
  .stage{position:relative;width:100%;aspect-ratio:16/10;background:#dbeafe;border-radius:20px;overflow:hidden;border:3px solid var(--line)}
  .stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
  svg text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  .halo{paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
  .live{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;min-height:42px}
  .pill{background:rgba(255,255,255,.94);border:2px solid var(--line);color:var(--blue-d);font-weight:900;font-size:17px;padding:5px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(15,23,42,.15)}
  .pill.on{background:var(--red);border-color:var(--red);color:#fff}
  .tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:3px solid #dbe5ee;background:#fff;border-radius:14px;font-weight:900;font-size:18px;padding:10px 16px;cursor:pointer;color:var(--ink2)}
  .tabs button.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}

  /* hotspots inside svg */
  .hs{cursor:pointer;outline:none}
  .hs .ring{fill:rgba(37,99,235,.2);stroke:#fff;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:ping 1.5s infinite}
  .hs .ringo{fill:none;stroke:#2563eb;stroke-width:4}
  .hs.swc .ringo{stroke:#dc2626} .hs.swc .ring{fill:rgba(220,38,38,.2)}
  .hs .bub rect{fill:#2563eb} .hs.swc .bub rect{fill:#dc2626}
  .hs .bub text{fill:#fff;font-weight:900;font-size:25px;text-anchor:middle}
  .hs.off .ring,.hs.off .ringo,.hs.off .bub{opacity:0}
  .hs:focus-visible .ringo{stroke-width:8}
  @keyframes ping{0%,100%{transform:scale(.92)}50%{transform:scale(1.1)}}
  .fx{fill:none;stroke:#f59e0b;stroke-width:6;transform-box:fill-box;transform-origin:center;animation:pop .55s ease-out forwards;pointer-events:none}
  @keyframes pop{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
  .flow{fill:none;stroke:#f59e0b;stroke-width:7;stroke-dasharray:4 14;stroke-linecap:round;animation:dash .8s linear infinite}
  .flow.ccw{animation-direction:reverse}
  @keyframes dash{to{stroke-dashoffset:-36}}
  .cf{fill:none;stroke:#fffbe0;stroke-width:5;stroke-dasharray:3 12;stroke-linecap:round;animation:dash2 .7s linear infinite}
  @keyframes dash2{to{stroke-dashoffset:-30}}
  .cfl{fill:none;stroke:#fde047;stroke-width:4;stroke-dasharray:3 9;stroke-linecap:round}
  .cfl2{fill:none;stroke:#fffbe0;stroke-width:2.6;stroke-dasharray:2 7;stroke-linecap:round}

  /* ---------- buttons ---------- */
  .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
  .btn{border:0;cursor:pointer;font-weight:900;font-size:23px;padding:16px 26px;min-height:64px;border-radius:18px;box-shadow:0 6px 14px rgba(15,23,42,.16);transition:.12s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.sw{background:#be123c;color:#fff}
  .btn.sw.on{background:#fff;color:#be123c;box-shadow:inset 0 0 0 4px #be123c,0 6px 14px rgba(15,23,42,.16)}
  .btn.ghost{background:#e2e8f0;color:var(--ink);box-shadow:none}
  .btn.tool{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 3px #cbd5e1;font-size:18px;padding:10px 16px;min-height:52px}
  .btn.tool.on{background:#eef2ff;color:#3730a3;box-shadow:inset 0 0 0 3px #818cf8}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;background:#e2e8f0;border-radius:18px;padding:5px;gap:5px;max-width:100%}
  .seg button{flex:1;border:0;background:transparent;font-weight:900;font-size:20px;padding:14px 18px;min-height:56px;border-radius:14px;cursor:pointer;color:var(--ink2)}
  .seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 3px 8px rgba(15,23,42,.18)}
  .grow{flex:1}

  /* ---------- text panel ---------- */
  .panel{display:flex;flex-direction:column;gap:14px}
  .task .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .tag{display:inline-block;font-weight:900;font-size:17px;padding:3px 14px;border-radius:999px;background:var(--blue);color:#fff}
  .tag.obsv{background:#0f766e}
  .tag.ask{background:#7c3aed}
  .task .txt{font-size:25px;font-weight:900;line-height:1.5;letter-spacing:-.01em}
  .task .how{margin-top:10px;font-size:20px;font-weight:700;color:var(--ink2);background:#f1f5f9;border-radius:14px;padding:10px 14px}
  .safety{margin-top:10px;background:var(--amber-bg);border:3px solid var(--amber-line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:19px;color:#78350f}
  .obs{background:var(--amber-bg);border:3px solid var(--amber-line);border-radius:20px;padding:14px 18px}
  .obs h3{margin:0 0 4px;font-size:16px;font-weight:900;letter-spacing:.04em;color:var(--amber)}
  .obs p{margin:0;font-size:21px;font-weight:800;line-height:1.55;color:#451a03}
  .hint{font-size:20px;font-weight:800;color:var(--muted);background:#f1f5f9;border-radius:16px;padding:14px 16px}

  .q{background:#fff;border:3px solid var(--line);border-radius:20px;padding:16px}
  .q h3{margin:8px 0 12px;font-size:23px;font-weight:900;line-height:1.5}
  .opts{display:grid;gap:10px}
  .opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-height:64px;padding:14px 16px;border-radius:16px;border:3px solid #e2e8f0;background:#f8fafc;font-weight:800;font-size:21px;line-height:1.45;touch-action:manipulation}
  .opt:active{background:var(--blue-bg)}
  .opt:focus-visible{outline:4px solid #93c5fd}
  .opt.wrong{border-color:#fca5a5;background:var(--red-bg);color:#991b1b;cursor:default}
  .opt.right{border-color:#6ee7b7;background:var(--green-bg);color:#065f46;cursor:default}
  .opt.dim{opacity:.5;cursor:default}
  .fb{margin-top:12px;font-weight:800;font-size:20px;line-height:1.55;border-radius:14px;padding:12px 14px}
  .fb.no{background:var(--red-bg);color:#991b1b}
  .fb.ok{background:var(--green-bg);color:#065f46}
  .fb b{display:inline-block;background:var(--green);color:#fff;border-radius:8px;padding:0 10px;margin-right:6px}

  .rule{background:#fff;border:3px solid #c4b5fd;border-radius:20px;padding:14px 16px}
  .rule h3{margin:0 0 6px;font-size:22px;font-weight:900;color:#5b21b6}
  .rule .lead{margin:0 0 10px;font-size:19px;font-weight:700;color:var(--ink2);line-height:1.5}
  .rule svg{width:100%;height:auto;display:block;background:#f5f3ff;border-radius:14px}
  .rule .rows{display:grid;gap:8px;margin-top:10px}
  .rule .row{display:flex;gap:10px;align-items:center;border-radius:14px;padding:9px 12px;font-weight:800;font-size:20px;line-height:1.4;border:3px solid}
  .rule .row .ic{font-size:30px;line-height:1}
  .rule .row small{display:block;font-size:16px;font-weight:700;opacity:.8}
  .rule .r1{background:#fff7ed;border-color:#fdba74;color:#7c2d12}
  .rule .r2{background:#f5f3ff;border-color:#c4b5fd;color:#4c1d95}
  .rule .r3{background:#ecfdf5;border-color:#6ee7b7;color:#065f46}
  .rule .r4{background:#fef9c3;border-color:#fde047;color:#713f12}
  .rule .rows + svg,.rule svg + .rows{margin-top:10px}
  .cmp{border:3px solid var(--line);background:#fff;border-radius:20px;overflow:hidden}
  .cmp > svg{display:block;width:100%;height:auto;cursor:zoom-in}
  .cmp .cap{padding:12px 16px;font-weight:800;font-size:20px;line-height:1.5}

  .self{background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:3px solid #86efac;border-radius:20px;padding:16px}
  .self h3{margin:0 0 10px;font-size:23px;font-weight:900;color:#065f46}
  .self .it{margin-top:12px;font-weight:800;font-size:20px;line-height:1.5}
  .self .tg{margin-right:6px}
  .lv{display:flex;gap:8px;margin-top:8px}
  .lv button{flex:1;min-height:56px;border:3px solid #cbd5e1;background:#fff;border-radius:14px;font-weight:900;font-size:21px;cursor:pointer}
  .lv button.on{border-color:var(--green);background:var(--green);color:#fff}
  .finish{background:#fff7ed;border:3px solid #fdba74;border-radius:20px;padding:16px;font-weight:900;font-size:23px;line-height:1.55;text-align:center;color:#9a3412}

  .prog{position:relative;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 16px 16px;font-weight:900;font-size:21px;overflow:hidden}
  .prog b{color:var(--blue-d)}
  .prog i{position:absolute;left:0;bottom:0;height:8px;background:var(--green);transition:width .3s}
  .okbox{background:var(--green-bg);border:3px solid #86efac;border-radius:16px;padding:14px 16px;font-weight:800;font-size:20px;line-height:1.55;color:#065f46}
  .nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .rec h3{margin:0 0 10px;font-size:21px;font-weight:900}
  table{width:100%;border-collapse:collapse;font-size:19px}
  th,td{padding:10px 12px;border:2px solid #e2e8f0;text-align:left;font-weight:800}
  th{background:#f1f5f9;font-size:17px;color:#475569}
  td.empty{color:#cbd5e1}
  td.yes{background:var(--green-bg);color:#065f46}
  footer{background:rgba(255,255,255,.9);border-top:1px solid var(--line);text-align:center;padding:14px;font-weight:800;color:var(--ink2);font-size:16px}

  #lb{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
  #lb.open{display:flex}
  #lb button{position:absolute;top:12px;right:12px;font-size:24px;font-weight:900;border:0;border-radius:14px;padding:12px 20px;background:#fff;cursor:pointer}

  @media (max-width:700px){
    body{font-size:19px} .sb{font-size:15px;min-height:70px} .sb .no{width:28px;height:28px;font-size:16px}
    .task .txt{font-size:23px} .btn{font-size:21px;padding:14px 18px}
    .goal{font-size:18px;flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){.hs .ring,.flow,.cf{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8fb"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ecd9"/><stop offset="1" stop-color="#e8d6b4"/></linearGradient>
    <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f19a3a"/><stop offset="1" stop-color="#c2610f"/></linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e9aa7"/><stop offset=".45" stop-color="#f4f7fa"/><stop offset="1" stop-color="#8e9aa7"/></linearGradient>
    <linearGradient id="gMetalB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5bfca"/><stop offset=".5" stop-color="#e6eaef"/><stop offset="1" stop-color="#b5bfca"/></linearGradient>
    <linearGradient id="gSupply" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fb"/><stop offset="1" stop-color="#dbe3ec"/></linearGradient>
  </defs>
</svg>

<header>
  <div class="hd">
    <div>
      <span class="chip">중학교 2학년 과학 · 전기와 자기</span>
      <h1>자기장 안에서 전류가 흐르는 코일이 받는 힘의 특성 추리하기</h1>
    </div>
    <div class="score" id="score">⭐ 0 / 6</div>
  </div>
</header>

<div class="wrap">
  <div class="goal"><span class="lab">무엇을 알아볼까</span><span>자기장 안에서 전류가 흐르는 코일이 받는 힘의 특성을 알 수 있다.</span></div>
  <ol class="bar6" id="bar6"></ol>

  <div class="layout">
    <div class="stagecol">
      <div class="tabs" id="tabs" hidden></div>
      <div class="live"><span class="pill" id="stepPill"></span><span class="pill on" id="onPill" hidden>● 전류가 흐르는 중</span></div>
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 0 1000 625" role="img" aria-label="가상 실험실 그림"></svg>
        <svg id="pair" viewBox="0 0 1000 625" role="img" aria-label="실험 결과 비교 그림" style="display:none"></svg>
      </div>
      <div class="acts" id="acts"></div>
    </div>

    <div class="panel">
      <div class="card task" id="task"></div>
      <div class="obs" id="obsBox"><h3>👀 관찰 결과</h3><p id="obs"></p></div>
      <div id="poles"></div>
      <div id="cmp"></div>
      <div id="qbox"></div>
      <div class="nav">
        <button class="btn ghost" id="prev">◀ 이전 과정</button>
        <button class="btn primary" id="next">다음 과정 ▶</button>
      </div>
    </div>
  </div>

  <div class="card rec" style="margin-top:18px">
    <h3>📝 내 관찰 기록표</h3>
    <table>
      <thead><tr><th>과정</th><th>바꾼 것</th><th>코일의 움직임</th></tr></thead>
      <tbody id="rec"></tbody>
    </table>
    <div style="margin-top:14px"><button class="btn ghost" id="reset">🔄 처음부터 다시</button></div>
  </div>
</div>
<footer>중학교 2학년 과학 · 자기장 안에서 전류가 흐르는 코일이 받는 힘 탐구 활동 (가상 실험)</footer>

<div id="lb" role="dialog" aria-label="그림 크게 보기"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = p => 1 - Math.pow(1-p, 3);
const easeIO = p => p<.5 ? 2*p*p : 1 - 2*(1-p)*(1-p);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

/* ================= 교과서 내용 ================= */
const STEPS = [
  {n:1, short:'자석 설치', text:'네오디뮴 자석을 책 고정대에 붙여 코일과 마주 보게 한다.', tag:null, changed:'', move:''},
  {n:2, short:'스위치 켜기', text:'그네형 코일 장치를 전원 장치에 연결한 뒤 스위치를 눌러 코일의 움직임을 관찰한다.', tag:'관찰', changed:'(처음 상태)', move:'자석 쪽으로 움직인다.'},
  {n:3, short:'자석 뒤집기', text:'자석을 반대로 뒤집어 붙여 자기장의 방향을 반대로 바꾸고, 코일의 움직임을 관찰한다.', tag:'관찰', changed:'자기장의 방향', move:'과정 2와 반대 방향으로 움직인다.'},
  {n:4, short:'전류 방향', text:'코일에 흐르는 전류의 방향을 반대로 바꾸고, 코일의 움직임을 관찰한다.', tag:'관찰', changed:'전류의 방향', move:'과정 3과 반대 방향으로 움직인다.'},
  {n:5, short:'전류 세기', text:'코일에 흐르는 전류의 세기를 더 세게 하고, 코일의 움직임을 관찰한다.', tag:'관찰', changed:'전류의 세기', move:'과정 4보다 더 크게 움직인다.'},
  {n:6, short:'정리', text:'정리해 볼까', tag:'추리 및 결론 도출', changed:'', move:''}
];

const CFG = {
  1:{ a:{how:'오른쪽에 있는 네오디뮴 자석을 끌어다 책 고정대에 붙여요. (눌러도 붙어요!)',
         hs:['magnet'], btn:{label:'🧲 자석을 붙인다', fn:'attachMagnet'}},
      b:{how:'자석이 코일과 마주 보고 있어요. 다음 과정으로 가요!'}},

function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

const stepQs = n => QS[n] || [];

const isDone = n => n===1 ? st[1].phase==='b'
                  : n===6 ? (QS[6].every(q => qs[q.id].done) && self.fn && self.att)
                  : (n===4 || n===5) ? observed(n)
                  : stepQs(n).every(q => qs[q.id].done);

/* 단계에 들어갈 때 장치를 그 단계의 모습으로 되돌린다 */
function applyStepState(){
  anims.length = 0;
  const n = cur, ph = st[n].phase;
  SC.on = false; SC.x = 0; SC.v = 0; SC.busy = false; SC.flip = null; SC.rec = true;
  SC.strength = (n===5) ? st[5].strength : 'weak';
  SC.attached = (n===1) ? ph==='b' : true;
  SC.mag = SC.attached ? {...MAGH} : {...MAGL};
  SC.magN = !(n>=4 || (n===3 && ph==='b'));
  SC.swapped = (n===5) || (n===4 && ph==='b');
  SC.swapT = SC.swapped ? 1 : 0;
  const conn = n>=3 || (n===2 && ph==='b');
  ['R','B'].forEach(k => { const c = SC.clip[k]; c.conn = conn; c.x = LOOSE[k].x; c.y = LOOSE[k].y; });
}

/* ================= 애니메이션 도우미 ================= */
const anims = [];
function tween(ms, fn, done){ anims.push({t0:performance.now(), ms, fn, done}); }
function runAnims(now){
  for(let i=anims.length-1;i>=0;i--){
    const a = anims[i]; if(!a) continue;
    const p = (now - a.t0)/a.ms;
    if(p>=1){ a.fn(1); anims.splice(i,1); if(a.done) a.done(); } else a.fn(p<0?0:p);
  }
}
function pop(x,y){
  const c = document.createElementNS(NS,'circle');
  c.setAttribute('class','fx'); c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',40);
  $('#fx').appendChild(c); setTimeout(() => c.remove(), 650);
}

/* ================= 동작(탐구 활동) ================= */
function attachMagnet(){
  if(SC.attached || SC.busy) return; SC.busy = true;
  const f = {...SC.mag};
  tween(380, p => { const e = easeOut(p); SC.mag.x = lerp(f.x, MAGH.x, e); SC.mag.y = lerp(f.y, MAGH.y, e); }, () => {
    SC.attached = true; SC.busy = false; SC.mag = {...MAGH}; pop(MAGH.x-10, MAGH.y);
    st[1].phase = 'b'; renderAll();
  });
}
function backMagnet(){
  const f = {...SC.mag}; SC.busy = true;
  tween(350, p => { const e = easeOut(p); SC.mag.x = lerp(f.x, MAGL.x, e); SC.mag.y = lerp(f.y, MAGL.y, e); }, () => { SC.busy = false; });
}
function connectClip(k){
  const c = SC.clip[k]; if(c.conn || c.moving) return; c.moving = true;
  const f = {x:c.x, y:c.y}, to = POST[k];
  tween(380, p => { const e = easeOut(p); c.x = lerp(f.x, to.x, e); c.y = lerp(f.y, to.y, e); }, () => {
    c.conn = true; c.moving = false; pop(to.x, to.y);
    if(SC.clip.R.conn && SC.clip.B.conn && cur===2 && st[2].phase==='a'){ st[2].phase = 'b'; renderAll(); }
  });
}
function connectAll(){ connectClip('R'); connectClip('B'); }
function backClip(k){
  const c = SC.clip[k], f = {x:c.x, y:c.y}, to = LOOSE[k]; c.moving = true;
  tween(350, p => { const e = easeOut(p); c.x = lerp(f.x, to.x, e); c.y = lerp(f.y, to.y, e); }, () => { c.moving = false; });
}
function flipMagnet(){
  if(SC.busy || SC.flip!==null) return; SC.busy = true; SC.flip = 0;
  tween(950, p => { SC.flip = p; }, () => {
    SC.magN = !SC.magN; SC.flip = null; SC.busy = false; pop(MAGH.x-10, MAGH.y);
    if(cur===3 && st[3].phase==='a'){ st[3].phase = 'b'; renderAll(); }
  });
}
function swapWires(){
  if(SC.busy) return; SC.busy = true;
  const from = SC.swapT, to = SC.swapped ? 0 : 1;
  tween(850, p => { SC.swapT = lerp(from, to, easeIO(p)); }, () => {
    SC.swapT = to; SC.swapped = !SC.swapped; SC.busy = false;
    if(cur===4 && st[4].phase==='a'){ st[4].phase = 'b'; renderAll(); }
  });
}

function setSwitch(on){
  if(!cfg().sw || SC.busy) return;

  if(on){ SC.rec = false; st[cur].seen[swKey()] = true; }

  if(!was && isDone(cur) && (cur===4 || cur===5)) nudgeNext();
}
function setStrength(k){
  if(SC.busy) return;
  st[5].strength = k; SC.strength = k;
  if(SC.on){ SC.rec = false; st[5].seen[k] = true; }

}
function answer(id, i){
  const q = ALLQ.find(x => x.id===id), s = qs[id];

  const was = isDone(cur);
  if(i===q.ans){ s.done = true; if(q.res) obsOverride = q.res; } else s.wrong.add(i);

let nudged = {};

function fieldSVG(N){

}

function clipPos(k){
  const c = SC.clip[k];
  if(!c.conn) return {x:c.x, y:c.y};
  const o = k==='R' ? 'B' : 'R', a = POST[k], b = POST[o], t = SC.swapT;
  return {x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t) - 30*Math.sin(Math.PI*t)*(k==='R'?1:-.3)};
}
function wirePath(s,e){
  const c1 = {x:s.x, y:s.y+100}, c2 = {x:e.x, y:e.y + (e.y<470 ? 120 : 60)};
  return 'M'+s.x+' '+s.y+' C'+c1.x+' '+c1.y+' '+c2.x+' '+c2.y+' '+e.x.toFixed(1)+' '+e.y.toFixed(1);
}

function drawDots(dt){
  const dots = $('#dots').children, flow = SC.on && circuitOK();
  if(!flow){ for(const d of dots) d.style.display='none'; return; }
  const strong = SC.strength==='strong', gap = strong ? 26 : 48, speed = strong ? 170 : 85;
  dotPhase = (dotPhase + speed*dt) % 100000;
  const wR = $('#wR'), wB = $('#wB');
  [[wR,0,false],[wB,30,true]].forEach(([w,off,rev]) => {
    const len = w.getTotalLength(), n = Math.min(30, Math.floor(len/gap));
    for(let i=0;i<30;i++){
      const d = dots[off+i];
      if(i>=n){ d.style.display='none'; continue; }
      let s = (dotPhase + i*gap) % (n*gap); const q = clamp(s/(n*gap)*len, 0, len);
      const pt = w.getPointAtLength(rev ? len-q : q);
      d.style.display=''; d.setAttribute('cx', pt.x.toFixed(1)); d.setAttribute('cy', pt.y.toFixed(1));
    }
  });
}

function svgPt(e){
  const svg = $('#scene'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;

(() => {
  const svg = $('#scene');
  svg.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('.hs'); if(!t) return;
    const h = HSMAP[t.dataset.id]; if(!h || !h.drag) return;
    if(h.off && h.off()) return;
    if(SC.busy && !h.drag) return;
    e.preventDefault(); drag = {h, start:svgPt(e), moved:false};
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  });
  svg.addEventListener('pointermove', e => {
    if(!drag) return; const p = svgPt(e);
    if(!drag.moved && Math.hypot(p.x-drag.start.x, p.y-drag.start.y) > 12) drag.moved = true;
    if(drag.moved) drag.h.setPos(p);
  });
  const end = () => { if(!drag) return; const d = drag; drag = null; if(d.moved) d.h.drop(); else d.h.tap(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e => {
    const t = e.target.closest && e.target.closest('.hs'); if(!t) return;
    const h = HSMAP[t.dataset.id]; if(h && !h.drag && h.tap) h.tap();

let lastT = performance.now(), stableCnt = 0;
function frame(now){
  const dt = Math.min(.05, (now-lastT)/1000); lastT = now;
  runAnims(now);
  if($('#scene').style.display!=='none'){
    const tg = targetX(), w = 7.5, z = .28;
    SC.v += (-w*w*(SC.x-tg) - 2*z*w*SC.v)*dt; SC.x += SC.v*dt;
    if(!SC.on && Math.abs(SC.x)<.3 && Math.abs(SC.v)<.5){ SC.x = 0; SC.v = 0; }
    /* 측정값 기록: 코일이 멈추었을 때 */
    if(SC.on && circuitOK() && !SC.rec){
      if(Math.abs(SC.v)<6 && Math.abs(SC.x-tg)<1.5){ stableCnt++; } else stableCnt = 0;
      if(stableCnt>12){ SC.rec = true; MEAS[SC.strength] = Math.abs(SC.x)/PXCM; stableCnt = 0; renderObs(); }
    } else stableCnt = 0;
    renderPoles(); drawCore(); drawCoilFlow(dt); drawWires(); drawDots(dt); drawSupply(dt); drawRuler(); drawInset(); drawHS();
    $('#labels').style.display = SC.showLabels ? '' : 'none';
    $('#lbMag').style.display = SC.attached ? '' : 'none';
  }
  requestAnimationFrame(frame);
}

  box.innerHTML = '<div class="rule"><h3>🧲 왜 움직일까? 마주 보는 극으로 알아봐요</h3>'
    + '<div class="rows">'
    + '<div class="row r1"><span class="ic">①</span><span>코일에 흐르는 전류의 방향<small>전류는 전원 장치의 (+)극에서 나와 코일을 지나 (−)극으로 돌아가요. 지금은 <b>'+(cw?'왼쪽':'오른쪽')+' 도선(▼)으로 들어와서</b> 코일을 돌고 <b>'+(cw?'오른쪽':'왼쪽')+' 도선(▲)으로 나가요.</b> 자석 쪽에서 보면 <b>'+(cw?'시계':'반시계')+' 방향</b>이에요.'+(SC.swapped ? '<br>💡 전선을 바꿔 꽂아서 들어오는 곳과 나가는 곳이 서로 바뀌었어요!' : '')+'</small></span></div>'
    + '<div class="row r2"><span class="ic">②</span><span>전류가 흐르는 코일은 전자석!<small>자석을 마주 보는 코일의 면은 '+poleSpan(cN)+'이에요.<br>(시계 방향 → S극, 반시계 방향 → N극)</small></span></div>'
    + '</div>' + polesSVG(N, cN, reveal)
    + '<div class="rows">'
    + '<div class="row r3"><span class="ic">③</span><span>마주 보는 극 비교<small>자석은 '+poleSpan(N)+', 코일은 '+poleSpan(cN)+' → <b>'+(same?'같은 극':'다른 극')+'끼리</b> 마주 봐요.</small></span></div>'
    + '<div class="row r4"><span class="ic">④</span><span>'
    + (reveal ? (same ? '같은 극끼리는 서로 <b>밀어내요</b><small>그래서 코일이 자석에서 멀어져요.</small>'
                      : '다른 극끼리는 서로 <b>끌어당겨요</b><small>그래서 코일이 자석 쪽으로 움직여요.</small>')
              : '스위치를 켜서 확인해요<small>같은 극끼리는 밀어내고, 다른 극끼리는 끌어당겨요.</small>')
    + '</span></div></div></div>';
}
function renderPanels(){ renderTask(); renderObs(); renderCmp(); renderQs(); renderNav(); renderTop(); renderPoles(); }

function renderAll(){
  const six = cur===6;
  $('#scene').style.display = six ? 'none' : '';
  $('#pair').style.display = six ? '' : 'none';
  $('#stepPill').textContent = '과정 '+cur+' · '+STEPS[cur-1].short; $('#stepPill').hidden = six;
  renderTabs(); if(six) drawPair();
  lastCore = ''; lastInset = ''; lastDisp = '';
  buildHS(); refreshStage(); renderPanels();
}
function enterStep(){ applyStepState(); renderAll(); }

/* 크게 보기 */
function openLb(src){
  const lb = $('#lb'); lb.innerHTML = '';
  const c = src.cloneNode(true); c.removeAttribute('id');
  const h = c.querySelector('#hs'); if(h) h.remove();
  c.style.cssText = 'width:98vw;height:auto;max-height:92vh;background:#fff;border-radius:12px;cursor:default';
  if(!c.getAttribute('viewBox')) c.setAttribute('viewBox','0 0 1000 625');
  const x = document.createElement('button'); x.textContent = '닫기 ✕';
  lb.append(c, x); lb.classList.add('open');
}
$('#lb').addEventListener('click', () => $('#lb').classList.remove('open'));
window.addEventListener('keydown', e => { if(e.key==='Escape') $('#lb').classList.remove('open'); });

enterStep();
requestAnimationFrame(frame);
</script>
